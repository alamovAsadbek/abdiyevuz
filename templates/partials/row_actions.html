{% load ui %}<div class="row" style="gap:6px;flex-wrap:nowrap">{% for a in r.actions %}{% if a.url %}<a class="ib2 {{ a.cls }}" title="{{ a.title }}" href="{{ a.url }}">{% icon a.icon %}</a>{% else %}<button type="button" class="ib2 {{ a.cls }}" title="{{ a.title }}" data-post="{{ a.post }}"{% if a.confirm %} data-confirm="{{ a.confirm }}"{% endif %}>{% icon a.icon %}</button>{% endif %}{% endfor %}</div>
